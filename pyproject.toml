[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epsa-mrs"
version = "1.0.0"
description = "Machine-checkable reporting profile and validator for object-detection evaluation protocols"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
authors = [{ name = "EPSA-MRS Authors" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
benchmark = ["pycocotools>=2.0", "ultralytics==8.4.127"]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["epsa_check"]
